# Hidden combos: the two modules fitted side by side (touching), both online. Players discover them.
# effects multiply stats like a module's pros; clears switches off flags.
combos:
  cold_fusion:
    name: Cold Fusion
    modules: [coolant_loop, overcharger]
    lore: "Overheat stalls are short, and the coolant stops choking the overclock."
    effects: { stall: 0.45, overclock-chance: 2.0 }
  strip_miner:
    name: Strip Miner
    modules: [magnet_coil, ore_sifter]
    lore: "The sifter skims Tokens off the magnet's haul."
    effects: { tokens: 2.5 }
  chain_reaction:
    name: Chain Reaction
    modules: [plasma_cutter, seismic_dampener]
    lore: "Charges and hammers set each other off."
    effects: { shaped-chance: 1.25, jack-chance: 1.25 }
  event_horizon:
    name: Event Horizon
    modules: [singularity_core, graviton_lens]
    lore: "The lens focuses the singularity: lasers reach twice as far."
    effects: { laser-length: 1.5, shaped-chance: 1.6 }
  # ---- Rod Rig combos ----
  deep_trawl:
    name: Deep Trawl
    modules: [salvage_magnet, sonar_pinger]
    lore: "The sonar paints every wreck on the bottom for the magnet."
    effects: { treasure: 1.5, scrap: 1.5 }
  feeding_frenzy:
    name: Feeding Frenzy
    modules: [chum_injector, twin_reel]
    lore: "Two lines in a churning school: everything bites at once."
    effects: { double-catch: 1.05, creature: 1.3 }
  # ---- Weapon Rig combos ----
  double_tap:
    name: Double Tap
    modules: [hair_trigger, speed_loader]
    lore: "The loader keeps pace with the trigger."
    effects: { fire-rate: 1.1, reload-time: 0.85 }
  marksman:
    name: Marksman
    modules: [long_barrel, laser_sight]
    lore: "The dot and the barrel finally agree."
    effects: { headshot: 1.15, range: 1.2 }
