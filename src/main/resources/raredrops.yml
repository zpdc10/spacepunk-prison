# Rare drops while mining (raredrops module). Every hand-broken block in a mine has a small chance to dig
# something up. The chance is multiplied by the drill's rare odds (Salvage Sense, Scavenger Rig). Blocks broken by
# area enchants roll at a reduced rate. A find picks a tier by weight, then an item of that tier that can drop on
# the current deck (falls back to a lower tier if the deck has nothing in it).
#
# Pace at the base chance with ~3,000 hand-broken blocks an hour: ~6 finds an hour, a Rare about every 1.5 hours,
# an Epic every ~4 hours, a Legendary every ~18 hours and a Mythic every ~170 hours (before Salvage Sense).

roll:
  base-chance: 0.002
  # Multiplier on the chance for blocks broken by Shaped Charge, Jackhammer, Cutting Laser...
  enchant-rate: 0.15
  # At most this many finds from one batch of blocks.
  max-per-event: 3

# Use the resource pack's spacepunk:raredrop/<model> item models.
use-item-models: true

# Announcement per tier: title = big title for the finder, broadcast = server-wide chat line (hover shows the item),
# global-sound = everyone online hears the tier's sound. Sounds are Minecraft sound keys.
tiers:
  common:
    name: Common
    color: "<#b8b0a0>"
    weight: 55
    sound: entity.item.pickup
    pitch: 0.7
  uncommon:
    name: Uncommon
    color: "<#7ccf6a>"
    weight: 28
    sound: entity.experience_orb.pickup
    pitch: 0.8
  rare:
    name: Rare
    color: "<#5aa0ff>"
    weight: 12
    title: true
    sound: block.amethyst_block.chime
    pitch: 1.0
  epic:
    name: Epic
    color: "<#c070ff>"
    weight: 4
    title: true
    broadcast: true
    sound: ui.toast.challenge_complete
    pitch: 1.2
  legendary:
    name: Legendary
    color: "<#ffb030>"
    weight: 0.9
    title: true
    broadcast: true
    global-sound: true
    sound: entity.player.levelup
    pitch: 0.6
  mythic:
    name: Mythic
    color: "<#ff4060>"
    weight: 0.1
    title: true
    broadcast: true
    global-sound: true
    sound: entity.wither.spawn
    pitch: 1.4

# Salvage caches pay Credits x per-grade^(grade - 1) x (1 + per-prestige x prestige) of the player OPENING them, the
# same curve as rank-up costs, so a cache is worth about the same number of minutes of mining at any grade (and
# hoarding them through a prestige gains nothing). Cache Credits count as server income for the prestige payout.
caches:
  per-grade: 1.26
  per-prestige: 0.5

# Blueprint fragments needed to assemble one random drill module of that rarity (/salvage, Assembly Bay).
fragments:
  COMMON: 5
  RARE: 5
  EPIC: 5
  LEGENDARY: 4

