name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check resource pack
        run: python3 tools/resourcepack/validate.py
      - name: Build plugin
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpacepunkPrison
          path: build/libs/SpacepunkPrison.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: spacepunk-pack
          path: |
            build/resourcepack/spacepunk-pack.zip
            build/resourcepack/spacepunk-pack.zip.sha1
          if-no-files-found: error

  wiki:
    # The server wiki (wiki/, MkDocs Material). Fails on broken links or nav so a bad page never reaches the site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wiki
        run: |
          pip install -r wiki/requirements.txt
          mkdocs build --strict -f wiki/mkdocs.yml

  publish-latest:
    # Every green build of main is published as the "latest" pre-release, which the server downloads on restart.
    needs: plugin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpacepunkPrison
      - uses: actions/download-artifact@v4
        with:
          name: spacepunk-pack
      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace assets in place (never delete first): the server downloads the jar on every restart,
          # so the asset must never be missing, even for a few seconds.
          FILES="SpacepunkPrison.jar spacepunk-pack.zip spacepunk-pack.zip.sha1"
          NOTES="Automatic build of main at $GITHUB_SHA"
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload latest $FILES --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create latest $FILES --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Latest build" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
