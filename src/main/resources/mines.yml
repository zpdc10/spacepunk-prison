# Mines module config. Placement (regions, spawns) is stored separately in mines-data.yml by the admin
# commands, so this file stays hand-editable. All tuning lives here; /mineadmin reload applies changes.

# Bumped when defaults change; older files on a server are migrated on start (see MinesModule).
config-version: 2

world:
  # World used by /mineadmin generate. Created as an empty void world if missing.
  name: mines
  create-if-missing: true
  # Make the first mine's spawn the mines world spawn after /mineadmin generate.
  set-spawn-to-first-mine: true
  # Until there is a hub world, send every joining player to the mines world spawn.
  send-players-on-join: true

# Auto layout used by /mineadmin generate: one row per deck (north to south), one column per mine.
layout:
  origin-x: 0
  origin-z: 0
  base-y: 40          # bottom layer of every mine
  spacing: 150        # blocks between mine centres
  rim-width: 4        # walkway around the top of each pit
  enclosed: true      # build each mine as a closed room: walls and a lit ceiling over the pit and walkway
  room-height: 9      # blocks from the walkway up to the ceiling
  ladders-per-wall: 3 # ladders set into each pit wall, floor to walkway, so nobody gets stuck at the bottom

refill:
  mined-fraction: 0.80      # reset once 80% of a mine's blocks are gone (20% left)
  interval-seconds: 0       # also reset on this timer if anything was mined (0 = off)
  warn-seconds: 60          # countdown before a reset while players are in the mine room (0 = no warning)
  on-startup: true          # refill every placed mine when the server starts
  use-fawe: true            # use FastAsyncWorldEdit (off-thread) when it is installed
  native-blocks-per-tick: 20000   # budget for the built-in refiller when FAWE is absent

limits:
  max-volume: 250000        # largest region /mineadmin define or create accepts

protection:
  pvp: false                # PvP inside mines and anywhere in the mines world
  fall-damage: false        # fall damage in the mines world
  protect-world: true       # only players with spacepunk.mines.build can edit the mines world outside the mine pits

display:
  boss-bar: true            # show the mine name and ore left while near a mine

# Shell blocks for /mineadmin generate. size: [x, depth, z] of the breakable area.
decks:
  scrapyard:
    name: Scrapyard
    color: "<#c8743a>"
    size: [33, 24, 33]
