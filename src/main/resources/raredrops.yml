# ---------------------------------------------------------------------------------------------------------------
# Scrap parts: salvaged electronics and machine parts from every activity. Uncommon, like Token finds: a few
# per hour of any activity, pristine ones every few hours, the Quantum Core very rarely.
# Each part comes in three states (separate items): Fried (repair it at the workshop Refurbisher), Working, and
# Pristine (counts as working, and is what fuses drill modules to Mk IV and Mk V).
# Parts build drill modules at the workshop Assembly Bench (workshop.yml assembly:). Item models:
# spacepunk:raredrop/part/<id>, part/<id>_fried, part/<id>_pristine (art in tools/resourcepack/scrap_art.py).
# ---------------------------------------------------------------------------------------------------------------
scrap:
  # How a find's state is picked (weights).
  states: { fried: 80, working: 14, pristine: 6 }
  # Mining: blocks broken by enchants roll at this share of the hand chance.
  enchant-rate: 0.02
  # chance = per trial: per hand-broken block, per fish, per kill, per run... max-per-event caps one roll.
  # Scavenger Rig, Quantum Sorter and the Salvage family bonus raise every source.
  sources:
    mining: { chance: 0.001 }             # ~3-4 an hour at a block a second
    fishing: { chance: 0.05 }             # per catch
    sea_creature: { chance: 0.3 }         # per sea creature killed
    parkour: { chance: 1.0, max-per-event: 2 }   # daily parkour reward: 2 rolls, always finds
    workshop: { chance: 0.05 }            # once a minute while your bay is processing and you're online
    undercroft_kill: { chance: 0.25 }     # per player downed in the Undercroft
    smuggle: { chance: 0.6 }              # per smuggling run that gets contraband out
    contract: { chance: 0.6 }             # per daily or weekly contract
    story: { chance: 1.0 }                # per story quest

