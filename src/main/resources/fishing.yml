# Fishing: the station's flooded decks. Every number here is tuning; /fishadmin reload re-reads this file.
#
# Money model: a fish's value is in "grade-1 Credits". The payout is
#   value x value-growth^(effective grade - 1) x area value-mult x (1 + fishing level bonus + Fillet + collection)
#   x your progression sell multiplier (grade/prestige bonus)
# where effective grade = min(your grade, the area's max-grade). So fishing keeps pace with mining at your
# own deck (about 60-75% of an un-upgraded drill), and fishing an old deck pays old-deck money.
# Fish money is server income (reason income:fishing), so it counts toward the prestige "earned this run".

world:
  # Separate void world (normal difficulty so sea creatures can fight; nothing else spawns there).
  name: station_waters
  # Build the hub and the five pools automatically the first time the world is created.
  auto-build: true
  base-y: 64
  # Distance between pool centres along +X from the hub.
  spacing: 44
  # Water size [x, depth, z] of each pool.
  pool-size: [19, 6, 19]
  # Walkway width around each pool.
  walkway: 4
  # Send players here with /waters. Players who fall into the void are returned to the hub.
  hub-name: "<#5fb4c8>Bilge Hub"

items:
  use-item-models: true
  # Base items. Fish keep a fish base so they look right without the pack; eating them is blocked.
  rod-material: FISHING_ROD

# Bite timing in ticks (20 = 1s), before Lure Speed, bait and lures shorten it (at most by max-bite-reduction).
bite:
  min-wait: 100
  max-wait: 300
  max-bite-reduction: 0.75

# What a bite turns out to be: relative weights. creature is a chance in [0..1] checked first.
catch:
  creature-chance: 0.035
  max-creature-chance: 0.30
  junk: 12
  fish: 85
  treasure: 3
  # Fish rarity weights (Angler's Eye, Glow Worms and Deep Hook scale every non-common weight up).
  rarity-weights:
    common: 64
    uncommon: 24
    rare: 9
    epic: 2.6
    legendary: 0.4

value:
  value-growth: 1.2584
  level-bonus: 0.01

# Per rarity: name/colour, fishing XP, Scales when gutted, and the reel-in minigame difficulty
# (none = landed straight away). zone = catch zone width (share of the track), speed = how hard the fish
# swims, erratic = chance per tick it changes direction, gain/drain = progress per tick inside/outside.
rarities:
  junk:      { name: Junk,      color: "<#8a8070>", xp: 1,   scales: 0 }
  common:    { name: Common,    color: "<#d8d0c0>", xp: 3,   scales: 1 }
  uncommon:  { name: Uncommon,  color: "<#6fd35a>", xp: 8,   scales: 3,
               minigame: { zone: 0.30, speed: 0.5, erratic: 0.025, gain: 0.016, drain: 0.008 } }
  rare:      { name: Rare,      color: "<#4fa8ff>", xp: 20,  scales: 8,
               minigame: { zone: 0.26, speed: 0.75, erratic: 0.04, gain: 0.013, drain: 0.009 } }
  epic:      { name: Epic,      color: "<#c46cff>", xp: 60,  scales: 25,
               minigame: { zone: 0.22, speed: 1.0, erratic: 0.06, gain: 0.011, drain: 0.010 } }
  legendary: { name: Legendary, color: "<#ffb43a>", xp: 250, scales: 100,
               minigame: { zone: 0.18, speed: 1.3, erratic: 0.085, gain: 0.009, drain: 0.011 } }

# Fishing level: XP to go from level L to L+1 = xp-base x xp-growth^(L-1).
levels:
  max: 50
  xp-base: 60
  xp-growth: 1.13

# Collections: catching N of one species raises its tier. Each tier: +value-bonus on that species and Scales.
collections:
  tiers: [1, 25, 100, 500, 2000]
  legendary-tiers: [1, 3, 10, 25, 60]
  value-bonus: 0.05
  scales: [5, 25, 100, 400, 1500]

leaderboard:
  # Weekly heaviest single catch. Resets Monday 00:00 UTC; the top three get Scales.
  weekly-rewards: [600, 300, 150]
  size: 10

# ---------------------------------------------------------------------------------------------------------
# Rods. Tier sets the enchant level cap, lure slots and what Fishing Level it needs. Upgrades cost Scales.
# ---------------------------------------------------------------------------------------------------------
rod:
  tiers:
    bent_wire:  { name: Bent Wire Rod,   color: "<#9c8a6e>", level: 1,  scales: 0,      max-enchant: 10, lure-slots: 1,
                  lore: "A coat hanger, a bolt and a lot of hope." }
    scrap_spinner: { name: Scrap Spinner, color: "<#c8743a>", level: 8,  scales: 800,  max-enchant: 20, lure-slots: 1,
                  lore: "Reel salvaged from a cargo winch." }
    carbon_line: { name: Carbon Line,    color: "<#7fd65a>", level: 18, scales: 6000,   max-enchant: 35, lure-slots: 2,
                  lore: "Woven from reactor shielding fibre." }
    mag_rail:   { name: Mag-Rail Rod,    color: "<#8fd3ff>", level: 30, scales: 30000,  max-enchant: 50, lure-slots: 2,
                  lore: "Magnetic coils fling the line twice as far." }
    void_angler: { name: Void Angler,    color: "<#b07cff>", level: 42, scales: 140000, max-enchant: 75, lure-slots: 3,
                  lore: "It hums. The fish hear it from three decks away." }
  # Enchants bought with Scales: cost of the next level = cost-base x cost-growth^(current level).
  # per-level is the effect per level (see effects below).
  enchants:
    lure_speed:    { name: Lure Speed,    color: "<#5fb4c8>", cost-base: 8,  cost-growth: 1.09, per-level: 0.010, effect: bite-speed,
                     description: "Fish bite sooner." }
    double_catch:  { name: Double Catch,  color: "<#6fd35a>", cost-base: 15, cost-growth: 1.09, per-level: 0.004, effect: double-catch,
                     description: "Chance to land two fish at once." }
    angler_eye:    { name: Angler's Eye,  color: "<#4fa8ff>", cost-base: 14, cost-growth: 1.09, per-level: 0.012, effect: rare-luck,
                     description: "Rarer fish bite more often." }
    treasure_luck: { name: Treasure Luck, color: "<#ffd23f>", cost-base: 12, cost-growth: 1.09, per-level: 0.03,  effect: treasure,
                     description: "More treasure, less junk." }
    chum_sense:    { name: Chum Sense,    color: "<#ff5a3c>", cost-base: 10, cost-growth: 1.09, per-level: 0.02,  effect: creature,
                     description: "Sea creatures surface more often." }
    steady_hands:  { name: Steady Hands,  color: "<#d8d0c0>", cost-base: 9,  cost-growth: 1.09, per-level: 0.0025, effect: zone,
                     description: "Wider catch zone in the reel-in." }
    line_strength: { name: Line Strength, color: "<#9c8a6e>", cost-base: 9,  cost-growth: 1.09, per-level: 0.008, effect: strength,
                     description: "Progress drains slower when the fish slips out." }
    harpoon:       { name: Harpoon,       color: "<#c46cff>", cost-base: 10, cost-growth: 1.09, per-level: 0.5,   effect: harpoon,
                     description: "Extra damage to sea creatures with your rod." }
    fillet:        { name: Fillet,        color: "<#ffb43a>", cost-base: 12, cost-growth: 1.09, per-level: 0.01,  effect: value,
                     description: "Fish sell for more." }

# Effects (shared by enchants, lures and bait):
#   bite-speed (share of wait removed), double-catch (chance), rare-luck (non-common weights x (1 + v)),
#   treasure (treasure weight x (1 + v), junk weight / (1 + v)), creature (creature chance x (1 + v)),
#   zone (added to the catch zone width), strength (drain x (1 - v)), harpoon (bonus damage), value (+ sell share)

# Lures are items (treasure and sea creature drops) that you slot into your rod in the rod bay.
lures:
  spinner:      { name: Rattle Spinner,  rarity: uncommon,  effects: { bite-speed: 0.12 }, lore: "Clatters like a loose panel." }
  deep_hook:    { name: Deep Hook,       rarity: rare,      effects: { rare-luck: 0.18 }, lore: "Sinks past the small stuff." }
  siren_lure:   { name: Siren Lure,      rarity: rare,      effects: { creature: 0.6 }, lore: "Sings on a frequency only monsters like." }
  salvage_hook: { name: Salvage Hook,    rarity: uncommon,  effects: { treasure: 0.6 }, lore: "Magnetised. Catches everything metal." }
  twin_hook:    { name: Twin Hook,       rarity: epic,      effects: { double-catch: 0.08 }, lore: "Two barbs, twice the trouble." }
  gyro_bobber:  { name: Gyro Bobber,     rarity: rare,      effects: { zone: 0.05 }, lore: "Stays level in any current." }
  kevlar_leader: { name: Kevlar Leader,  rarity: uncommon,  effects: { strength: 0.25 }, lore: "Rated for hull breaches." }
  golden_rivet: { name: Golden Rivet,    rarity: legendary, effects: { value: 0.15, rare-luck: 0.10, treasure: 0.25 }, lore: "Pried off the old captain's chair." }

# Bait: bought in the bait shop (Credits, price x value-growth^(grade-1)) and used up one per catch.
bait:
  grub_paste:   { name: Grub Paste,      price: 30,  amount: 16, effects: { bite-speed: 0.20 }, lore: "Ground-up vent grubs. Fish love it." }
  glow_worms:   { name: Glow Worms,      price: 90,  amount: 16, effects: { rare-luck: 0.25 }, lore: "Bioluminescent. Rare fish come to look." }
  chum_canister: { name: Chum Canister,  price: 70,  amount: 16, effects: { creature: 1.0 }, lore: "Whatever this was, the big ones want it." }
  magnet_bits:  { name: Magnet Bits,     price: 70,  amount: 16, effects: { treasure: 1.0 }, lore: "Pulls loose salvage off the floor." }
  coolant_gel:  { name: Coolant Gel,     price: 45,  amount: 16, effects: { zone: 0.04, strength: 0.15 }, lore: "Keeps the line from snapping." }

# ---------------------------------------------------------------------------------------------------------
# Areas: one pool per deck. grade = clearance needed, max-grade caps the value scaling, value-mult rewards
# newer decks. biome tints the water. Blocks are the deck shell blocks the resource pack retextures.
# ---------------------------------------------------------------------------------------------------------
areas:
  scrapyard:
    name: Scrapyard Runoff
    color: "<#c8743a>"
    grade: 1
    max-grade: 5
    value-mult: 1.0
    biome: swamp
    wall: WAXED_WEATHERED_CUT_COPPER
    floor: POLISHED_ANDESITE
    light: OCHRE_FROGLIGHT
    description: "Oily runoff from the scrap presses. Things live in it anyway."
  reactor:
    name: Sludge Tanks
    color: "<#7fd65a>"
    grade: 6
    max-grade: 10
    value-mult: 1.1
    biome: mangrove_swamp
    wall: POLISHED_DEEPSLATE
    floor: POLISHED_TUFF
    light: VERDANT_FROGLIGHT
    description: "Reactor coolant gone thick and green. Don't drink it."
  cryo:
    name: Frozen Pools
    color: "<#8fd3ff>"
    grade: 11
    max-grade: 15
    value-mult: 1.2
    biome: cold_ocean
    wall: POLISHED_DIORITE
    floor: SMOOTH_STONE
    light: SEA_LANTERN
    description: "Thawed stasis fluid. Some of the fish were frozen on purpose."
  hull:
    name: Breach Flood
    color: "<#b07cff>"
    grade: 16
    max-grade: 20
    value-mult: 1.3
    biome: warm_ocean
    wall: POLISHED_BLACKSTONE_BRICKS
    floor: CRACKED_POLISHED_BLACKSTONE_BRICKS
    light: PEARLESCENT_FROGLIGHT
    description: "Seawater from somewhere that isn't here, leaking through the hull."
  foundry:
    name: Quench Tanks
    color: "<#ff5a3c>"
    grade: 21
    max-grade: 25
    value-mult: 1.4
    biome: lukewarm_ocean
    wall: POLISHED_BASALT
    floor: POLISHED_BLACKSTONE
    light: SHROOMLIGHT
    description: "Where the foundry cools its castings. The water never stops boiling."

