# Daily reward roll per deck: one line is picked by weight.
#   credits: flat Credits; credits-grade-cost: share of the player's next rank-up cost (income, counts for prestige)
#   tokens: N or [min, max]; shards: N; commands: console commands ({player}); text: what the player is told
#   rare: true broadcasts the find to the server.
# Crate keys from the rare drops system can be added here as commands once it exists.
