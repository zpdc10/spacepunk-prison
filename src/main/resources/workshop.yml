# Refurbisher (workshop menu): repairs fried scrap parts into working ones. pristine = chance a repair comes
# out Pristine instead. Upgrade it for better odds (credits + Bay Locker components, minimum grade).
refurbisher:
  grade: 1
  levels:
    - { name: "Mk I", pristine: 0.05 }
    - { name: "Mk II", pristine: 0.10, credits: 150000, grade: 6, components: { copper_ingot: 32 } }
    - { name: "Mk III", pristine: 0.18, credits: 4000000, grade: 14, components: { conductive_alloy: 24, hardened_steel: 16 } }
  # Cost to repair one fried part, by the part's tier (raredrops.yml tiers). components come from the Bay Locker.
  costs:
    common: { credits: 1000, components: { slag_dust: 16 } }
    uncommon: { credits: 5000, components: { crushed_copper: 16 } }
    rare: { credits: 30000, components: { copper_concentrate: 12 } }
    epic: { credits: 200000, components: { steel_ingot: 12 } }
    legendary: { credits: 2000000, components: { conductive_alloy: 8 } }

