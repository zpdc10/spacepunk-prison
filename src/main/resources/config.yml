# Spacepunk Prison core config. Each feature module has its own section or file (mines.yml, drill.yml, ...).
storage:
  autosave-seconds: 120
worlds:
  # No rain or thunder in any world, ever (the station has no sky).
  disable-weather: true
  # Switch off vanilla mechanics that don't fit the station: natural mob spawning (and remove stray mobs),
  # daylight cycle, phantoms, patrols, traders, raids, mob griefing, fire spread and advancement chat.
  vanilla-cleanup: true
  # No vanilla XP at all (no orbs, no gains, XP zeroed on join, no enchanting/anvil/grindstone).
  # The XP bar is only drawn by the fishing minigame.
  disable-xp: true
