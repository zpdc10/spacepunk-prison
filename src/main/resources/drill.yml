# Drill: the player's custom pickaxe. Frames, Token enchants, modules and heat.
# Every number is a starting point for playtesting. Change it here and run /drill admin reload.

item:
  # Base vanilla item. The resource pack replaces its look through the item_model component.
  material: NETHERITE_PICKAXE
  # Set to false while the resource pack does not have the spacepunk:* models yet (avoids missing-texture items).
  use-item-models: true

tokens:
  # Tokens drop while you work: uncommon, but not rare. Prestige pays no Tokens (it pays Shards).
  # Target: a few hours in the mine buys a couple of drill enchant upgrades at whatever stage you're at.
  # At about one hand-broken block a second that is a find every ~3 minutes, worth about:
  #   grade 1 ~100/h, grade 10 ~240/h, grade 15 ~380/h, grade 20 ~620/h, grade 25 ~980/h (prestige 0)
  # which is about 40K Tokens over a ~71 hour first run. Pace model: docs/progression-balance.md
  # Base Token find from blocks you break by hand: chance per block and amount range (at mine grade 1).
  hand-chance: 0.006
  min: 4
  max: 7
  # Every Token drop from mining (base find, Token Siphon, Salvage Sense caches) is multiplied by
  # grade-growth^(mine grade - 1) x prestige-growth^prestige. Grade 25 = x9.85, prestige 5 = x2.0, prestige 10 = x4.0.
  grade-growth: 1.10
  prestige-growth: 1.15
  # Blocks broken by enchants (Shaped Charge, Jackhammer, Cutting Laser) roll Tokens at this fraction of the hand chance.
  enchant-block-rate: 0.05

salvage:
  # Chance per hand-broken block to salvage a random drill module, before Salvage Sense and Scavenger Rig.
  module-chance: 0.00002
  # Announce module finds to the whole server.
  broadcast: true

# Frames in upgrade order. A frame unlocks at (prestige, grade): prestige higher than required, or equal with
# grade at least the required grade. Once bought, a frame is kept forever (including through prestige).
frames:
  rusted:
    name: Rusted
    color: "#8a6a55"
    grade: 1
    prestige: 0
    cost-currency: TOKENS
    cost: 0
    sockets: 0
    # Module rig: a grid of cells that modules fit into by shape. No rig on this frame.
    # Block break speed multiplier before Bore Speed (1.0 = a plain netherite pickaxe).
    base-speed: 0.5
    # Extra heat capacity on top of heat.base-capacity.
    heat-capacity: 0
    lore: "Patched together from hull scrap. It mostly works."
  salvaged:
    name: Salvaged
    color: "#b08850"
    grade: 10
    prestige: 0
    # About 2-3 hours of Credits income at grade 10.
    cost-currency: CREDITS
    cost: 175000
    sockets: 1
    rig: { width: 2, height: 2 }
    base-speed: 0.65
    heat-capacity: 25
    lore: "Stripped from a decommissioned loader. A small module rig."
  industrial:
    name: Industrial
    color: "#d0a040"
    grade: 1
    prestige: 1
    cost-currency: SHARDS
    cost: 5
    sockets: 2
    rig: { width: 3, height: 3 }
    base-speed: 0.85
    heat-capacity: 60
    lore: "Foundry-grade housing. Heavy, loud, reliable."
  military:
    name: Military
    color: "#7fa36a"
    grade: 1
    prestige: 5
    cost-currency: SHARDS
    cost: 30
    sockets: 3
    # core = cells that only take Legendary modules (every Legendary must cover one). [x, y] from the top left.
    rig: { width: 4, height: 3, core: [[3, 1]] }
    base-speed: 1.1
    heat-capacity: 110
    lore: "Breaching drill from the station's security armory."
  prototype:
    name: Prototype
    color: "#c070ff"
    grade: 1
    prestige: 15
    cost-currency: SHARDS
    cost: 120
    sockets: 4
    rig: { width: 5, height: 4, core: [[4, 1], [4, 2]] }
    base-speed: 1.5
    heat-capacity: 180
    lore: "Experimental core-tapping rig. Nobody knows who built it."

# Token enchants. Cost of level N = base * growth^(N-1), rounded.
# max-level lists the level cap for each frame, in the frame order above (0 = locked on that frame).
# Caps are the hard gate: a fully upgraded drill needs the Prototype frame (high prestige) whatever your Tokens.
# heat = heat added each time the enchant fires (before the deck multiplier).
enchants:
  bore_speed:
    name: Bore Speed
    color: "#e0a050"
    icon: GOLDEN_PICKAXE
    description: "Spins the bit faster. Raw mining speed."
    base: 15
    growth: 1.1
    max-level: [15, 30, 50, 75, 100]
    # Added to the frame's base-speed per level (block break speed multiplier).
    per-level: 0.08
  yield:
    name: Yield
    color: "#f0d060"
    icon: RAW_GOLD
    description: "Pulls more ore out of every block."
    base: 20
    growth: 1.1
    max-level: [10, 25, 50, 80, 120]
    # +2.5% ore per level (works on every block the drill breaks, enchants included).
    per-level: 0.025
  token_siphon:
    name: Token Siphon
    color: "#50d0e0"
    icon: PRISMARINE_CRYSTALS
    description: "Chance to siphon bonus Tokens from each block."
    base: 25
    growth: 1.1
    max-level: [10, 25, 50, 80, 120]
    # Extra find chance on top of tokens.hand-chance (0.6%), same amounts and scaling as the base find.
    # Level 10 = +25% Tokens, level 25 = +62%, capped at +250% (1.5%).
    chance-per-level: 0.00015
    max-chance: 0.015
    amount-min: 4
    amount-max: 7
    # Bonus amount grows by this share per level.
    amount-per-level: 0.01
  shaped_charge:
    name: Shaped Charge
    color: "#ff7040"
    icon: TNT
    description: "Chance to blow out a sphere of blocks."
    base: 60
    growth: 1.11
    max-level: [5, 15, 30, 50, 75]
    chance-per-level: 0.0008
    max-chance: 0.08
    radius-base: 2
    # +1 radius every this many levels.
    radius-every: 12
    radius-max: 6
    heat: 6
  jackhammer:
    name: Jackhammer
    color: "#ff4060"
    icon: ANVIL
    description: "Chance to clear the whole layer of the mine."
    base: 4000
    growth: 1.13
    max-level: [0, 0, 10, 25, 40]
    chance-per-level: 0.0003
    max-chance: 0.02
    max-blocks: 4000
    heat: 22
  cutting_laser:
    name: Cutting Laser
    color: "#ff3030"
    icon: END_ROD
    description: "Chance to fire a laser through the blocks ahead."
    base: 1200
    growth: 1.12
    max-level: [0, 10, 25, 40, 60]
    chance-per-level: 0.0008
    max-chance: 0.06
    length-base: 6
    length-per-level: 0.4
    length-max: 40
    heat: 5
  overclock:
    name: Overclock
    color: "#a0f0ff"
    icon: LIGHTNING_ROD
    description: "Chance to overclock the motor for a burst of speed."
    base: 80
    growth: 1.11
    max-level: [5, 15, 30, 50, 75]
    chance-per-level: 0.0004
    max-chance: 0.03
    duration-base: 3.0
    duration-per-level: 0.05
    # Break speed bonus while overclocked (0.75 = +75%).
    speed-bonus: 0.75
    # Heat gain multiplier while overclocked.
    heat-multiplier: 1.5
    heat: 4
  salvage_sense:
    name: Salvage Sense
    color: "#c0a0ff"
    icon: SPYGLASS
    description: "Sniffs out salvage: Token caches, modules, rare drops."
    base: 1500
    growth: 1.12
    max-level: [0, 10, 25, 40, 60]
    # Rare drop and module odds +4% per level.
    rare-per-level: 0.04
    # Chance per hand-broken block of a Token cache. Cache size also scales with mine grade and prestige (tokens.grade-growth).
    cache-chance-per-level: 0.000005
    cache-min: 15
    cache-max: 50
    cache-per-level: 0.02
  coolant:
    name: Coolant System
    color: "#60a0ff"
    icon: BLUE_ICE
    description: "Raises the heat limit and cools the drill faster."
    base: 30
    growth: 1.11
    max-level: [5, 15, 30, 50, 75]
    capacity-per-level: 4
    decay-per-level: 0.15

heat:
  base-capacity: 100
  # Heat per block broken by hand. Area enchants add their own heat when they fire.
  hand-block: 0.35
  # Cooling per second once you stop mining for decay-delay seconds, and while you keep mining.
  decay-per-second: 12
  active-decay-per-second: 0.6
  decay-delay: 1.5
  # Heat gain multiplier per deck (Scrapyard, Reactor Ducts, Cryo Vaults, Hull Breach, Core Foundry).
  deck-multiplier: [0.35, 0.6, 0.85, 1.0, 1.2]
  overheat:
    stall-seconds: 3.0
    # Heat left after the stall, as a share of capacity.
    heat-after: 0.4
  vent:
    # Press your drop key (Q) while holding the drill to vent. Needs at least this share of capacity.
    min-fraction: 0.3
    cooldown-seconds: 6
    burst-seconds-base: 2.0
    burst-seconds-per-fraction: 4.0
    # Break speed bonus during the vent burst (0.4 = +40%).
    burst-speed: 0.4
    # Venting inside this window is a perfect vent: burst bonus times perfect-multiplier.
    perfect-min: 0.75
    perfect-max: 0.95
    perfect-multiplier: 2.0

# ---------------------------------------------------------------------------------------------------------------
# Modules: physical parts fitted on the frame's module rig (shift + right-click the drill, Module Rig).
# Each has a shape (DOT 1x1, BAR2 1x2, BAR3 1x3, ELL 3-cell L, TEE, ZIG, SQUARE 2x2) that must fit the grid.
#
# pros / cons map a stat to its Mk I multiplier (1.5 = +50%, 0.85 = -15%). Every module keeps a downside.
# Stats: break-speed, yield, tokens, rare, scrap, sell, heat-capacity, hand-heat, cooling, proc-heat,
#   shaped-chance, shaped-radius, shaped-heat, jack-chance, laser-chance, laser-length, overclock-chance,
#   burst, stall, cache-chance. Flags (true): auto-sell.
# rarity: COMMON, RARE, EPIC, LEGENDARY. Legendary modules need a core cell. weight = share of finds.
# family: set bonuses and limits (families: below). rules: edge (must touch the rig's border), needs: <family>
#   (must touch one), avoid: <family> (must not touch one), drain: x (cons of every touching module are
#   raised to this extra power). A module that breaks a rule goes offline until it's moved.
# core-part: the scrap part (raredrops.yml parts:) it needs to fuse to high marks. model = spacepunk:module/<model>.
# ---------------------------------------------------------------------------------------------------------------

# Marks: fuse two identical modules of the same mark into the next mark (Module Rig, Fuse Modules).
# pros become value^pro-power, cons become value^con-power, per mark Mk I..Mk V.
module-marks:
  max: 5
  pro-power: [1.0, 1.2, 1.4, 1.6, 1.8]
  con-power: [1.0, 0.85, 0.7, 0.55, 0.4]
  # Scrap parts (the module's core-part) needed to fuse INTO this mark. state = minimum quality.
  fuse-parts:
    3: { state: WORKING, amount: 2 }
    4: { state: PRISTINE, amount: 1 }
    5: { state: PRISTINE, amount: 3 }

# Rig expansions, bought in order with Shards in the Module Rig. Each adds columns to the right of the rig.
# frame = the lowest frame that can take it. Kept forever (through prestige).
rig-expansion:
  - { shards: 15, columns: 1, frame: industrial }
  - { shards: 75, columns: 1, frame: military }

# Schematics every player knows from the start (the Assembly Bench in the workshop builds known schematics).
starting-schematics: [servo_actuator, ore_sifter, reel_servo, extended_mag]

# Rod Rig and Weapon Rigs: the same module system for fishing rods and guns (/rig rod, /rig gun).
# rod = one grid per rod tier, in fishing.yml rod.tiers order. gun = one grid per gun id (each gun model has its
# own rig, shared by every copy of that gun you carry). core = Legendary-only cells. Max 7 wide, 4 tall.
gear-rigs:
  rod:
    - { width: 2, height: 1 }                    # Bent Wire Rod
    - { width: 2, height: 2 }                    # Scrap Spinner
    - { width: 3, height: 2 }                    # Carbon Line
    - { width: 3, height: 3, core: [[2, 1]] }    # Mag-Rail Rod
    - { width: 4, height: 3, core: [[3, 1]] }    # Void Angler
  gun:
    rivet_pistol: { width: 2, height: 2 }
    scrap_smg: { width: 3, height: 2 }
    breach_shotgun: { width: 3, height: 2 }
    bolt_rifle: { width: 4, height: 2, core: [[3, 1]] }
    plasma_lance: { width: 4, height: 3, core: [[3, 1]] }
    default: { width: 2, height: 2 }

# Chance per event to find a random module of that kind (weighted by module weight). Like Token drops: uncommon,
# not rare. Rod modules come from fishing, weapon modules from the Undercroft. Both are also built at the
# workshop Assembly Bench from schematics.
module-drops:
  rod:
    fish: 0.0015
    treasure: 0.01
    sea-creature: 0.02
  gun:
    undercroft-kill: 0.03
    smuggle: 0.05

# Families: running several online modules of a family gives the listed bonuses (each threshold adds on).
# max = how many of the family one rig can run.
families:
  thermal:
    name: Thermal
    color: "#60b8ff"
    lore: "Coolant, fins and heat recyclers."
    bonuses:
      2: { heat-capacity: 1.15 }
      3: { cooling: 1.3, hand-heat: 0.85 }
  kinetic:
    name: Kinetic
    color: "#e0a040"
    lore: "Motors, hammers and lenses for the area enchants."
    bonuses:
      2: { shaped-chance: 1.1, jack-chance: 1.1, laser-chance: 1.1 }
      3: { break-speed: 1.08, proc-heat: 0.85 }
  salvage:
    name: Salvage
    color: "#9ccf6a"
    lore: "Sorters and sifters that pull value out of the slag."
    bonuses:
      2: { rare: 1.15 }
      3: { scrap: 1.25, tokens: 1.1 }
  arc:
    name: Arc
    color: "#ff70d0"
    max: 2
    lore: "High-voltage parts. Unstable: a rig can only run two."
    bonuses:
      2: { burst: 1.25, overclock-chance: 1.15 }
  void:
    name: Void
    color: "#a070ff"
    max: 1
    lore: "Core-tapping tech. One per rig, and it drains its neighbours."
  # ---- Rod Rig families ----
  sonar:
    name: Sonar
    color: "#5fb4c8"
    lore: "Pingers and scanners that find what's down there."
    bonuses:
      2: { rare-luck: 1.05 }
      3: { creature: 1.2, treasure: 1.2 }
  tackle:
    name: Tackle
    color: "#d8c090"
    lore: "Reels, spools and line gear."
    bonuses:
      2: { strength: 1.1 }
      3: { bite-speed: 1.06, double-catch: 1.02 }
  # ---- Weapon Rig families ----
  ballistic:
    name: Ballistic
    color: "#e08050"
    lore: "Mags, triggers and presses: more lead, faster."
    bonuses:
      2: { magazine: 1.1 }
      3: { damage: 1.05 }
  optics:
    name: Optics
    color: "#90e0ff"
    lore: "Sights and barrels that put rounds where you look."
    bonuses:
      2: { spread: 0.9 }
      3: { headshot: 1.1, recoil: 0.85 }

