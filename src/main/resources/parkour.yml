    decor-chance: 0.3
  4:
    blocks: [POLISHED_BLACKSTONE_BRICKS, CRACKED_POLISHED_BLACKSTONE_BRICKS, POLISHED_BLACKSTONE, OBSIDIAN]
    slab: POLISHED_BLACKSTONE_BRICK_SLAB
    trapdoor: IRON_TRAPDOOR
